<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Console — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="admin-left">
      <div class="brand">
        <img src="assets/logo.svg" alt="logo">
        <div style="display:flex;flex-direction:column">
          <strong>Elearning</strong>
          <small class="muted">Admin Console</small>
        </div>
      </div>

      <div class="admin-search" role="search" aria-label="Search resources">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="adminSearch" placeholder="Search users, courses, media...">
        <button id="searchBtn" class="btn outline small">Search</button>
      </div>
    </div>

    <div class="admin-actions">
      <div class="badge" id="apiStatus">API: --</div>
      <div class="admin-settings" style="display:flex;gap:8px;align-items:center;margin-left:12px">
        <input id="apiUrl" placeholder="API URL (e.g. http://localhost:3000/api/v1)" style="padding:6px;border-radius:4px;border:1px solid #ddd;width:320px">
        <input id="authToken" placeholder="Auth token (optional)" style="padding:6px;border-radius:4px;border:1px solid #ddd;width:220px">
        <button id="saveToken" class="btn outline small">Save</button>
        <button id="clearToken" class="btn outline small">Clear</button>
        <input id="loginEmail" placeholder="Email" style="padding:6px;border-radius:4px;border:1px solid #ddd;width:220px">
        <input id="loginPassword" placeholder="Password" type="password" style="padding:6px;border-radius:4px;border:1px solid #ddd;width:180px">
        <button id="loginBtn" class="btn outline small">Login</button>
      </div>
      <div class="user-menu" title="Signed in user">
        <div class="user-avatar"><img src="assets/avatar.png" alt="avatar"></div>
        <div style="text-align:left"><strong id="adminName">Admin</strong><div class="muted" id="adminEmail">admin@example.com</div></div>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-title">Resources</div>
      <div class="nav-section">
        <h3>Manage</h3>
        <nav class="resource-nav" id="resourceNav"></nav>
      </div>
      <div class="nav-section">
        <h3>Utilities</h3>
        <button id="openLogs" class="resource-link">Logs</button>
        <button id="clearCache" class="resource-link">Clear Cache</button>
      </div>
    </aside>

    <section class="app-content">
      <div class="page-title">
        <div>
          <div class="breadcrumb">Admin / <span id="resourceBreadcrumb">Users</span></div>
          <h1 id="resourceLabel">Users</h1>
          <p class="muted">Manage your backend models and controllers from one static frontend.</p>
        </div>
        <div class="page-actions">
          <button id="refreshBtn" class="btn outline">Refresh</button>
          <button id="clearFormBtn" class="btn outline">Reset form</button>
          <button id="newResourceBtn" class="btn primary">+ New</button>
        </div>
      </div>

      <div class="resource-grid">
        <div class="panel card">
          <div class="panel-header">
            <h2>List</h2>
          </div>
          <div id="resourceList" class="resource-list"></div>
        </div>

        <div class="panel card">
          <div class="panel-header">
            <h2>Create / Update</h2>
          </div>
          <form id="resourceForm" class="form"></form>
        </div>
      </div>

      <div id="resourceMessage" class="info-message"></div>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
