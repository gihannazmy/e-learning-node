<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/logo.svg" alt="logo">
      <span>E‑Learning</span>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Sign in</a>
    </nav>
  </header>

  <main class="page-forgot">
    <aside class="hero">
      <img src="assets/hero.svg" alt="hero illustration" class="hero-img">
      <div class="hero-text">
        <h1>Reset your password</h1>
        <p>Enter your email and we'll send instructions to get you back into your account.</p>
      </div>
    </aside>

    <section class="auth">
      <div class="auth-card">
        <img src="assets/logo.svg" alt="logo" class="logo">
        <h2>Reset password</h2>
        <p class="muted">Enter your email below to receive reset instructions.</p>
        <form id="forgotForm" class="form" novalidate>
          <label class="label">Email
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </label>
          <button type="submit" class="btn primary">Send reset link</button>
          <p class="small"><a href="index.html">Back to sign in</a></p>
        </form>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
