<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courses — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="courses" data-nav="courses">
  <header class="site-header">
    <div class="brand">
      <img src="assets/logo.svg" alt="logo">
      <span>E‑Learning</span>
    </div>
    <nav class="nav-links" id="mainNav"></nav>
    <div class="header-actions">
      <span class="nav-user" id="navUserName"></span>
      <img src="assets/avatar.svg" alt="avatar" class="nav-avatar">
      <a class="nav-link" href="#" id="signOutLink">Sign out</a>
    </div>
  </header>

  <section class="page-hero page-hero--compact">
    <div class="page-hero-inner">
      <h1>Course catalog</h1>
      <p>Browse published courses, filter by department, and enroll in seconds.</p>
    </div>
  </section>

  <main class="page-dashboard">
    <section class="dashboard-main">
      <div class="card">
        <div class="section-title">Available courses</div>
        <p class="section-subtitle">Open a course to view lessons, media, and exams.</p>
        <div id="departmentsContainer" class="dept-list"></div>
        <div id="coursesContainer" class="course-list course-list--grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 E‑Learning Platform</span>
    <span><a href="dashboard.html">Dashboard</a></span>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
