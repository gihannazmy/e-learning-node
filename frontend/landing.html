<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home — E‑Learning</title>

</head>
<body>
  <header style="padding:18px 32px;display:flex;justify-content:space-between;align-items:center;">

    <nav style="display:flex;gap:12px;align-items:center">
