<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="dashboard" data-nav="dashboard">
  <header class="site-header">
    <div class="brand">
      <img src="assets/logo.svg" alt="logo">
      <span>Dashboard</span>
    </div>
    <nav class="nav-links" id="mainNav"></nav>
    <span class="nav-user" id="navUserName"></span>
    <img src="assets/avatar.svg" alt="avatar" class="nav-avatar">
  </header>

  <main class="page-dashboard">
    <div class="dashboard-grid">
      <aside class="dashboard-sidebar">
        <div class="card">
          <h2>Your courses</h2>
          <ul class="course-list"></ul>
        </div>
      </aside>
      <section class="dashboard-main">
        <div class="card">
          <div class="section-title">Welcome back, Student</div>
          <p>Resume your enrolled courses or browse the catalog for new ones.</p>
          <div class="dashboard-summary"></div>
          <div class="cta-row" style="margin-top:20px">
            <a class="btn primary" href="courses.html">Browse courses</a>
            <a class="btn outline" href="exams.html">View exams</a>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
