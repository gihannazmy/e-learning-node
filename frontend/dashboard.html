<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.04)">
    <div style="display:flex;gap:12px;align-items:center">
      <img src="assets/logo.svg" alt="logo" style="width:40px">
      <strong>Dashboard</strong>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="landing.html" class="link">Home</a>
      <img src="assets/avatar.svg" alt="avatar" style="width:40px;border-radius:999px">
    </div>
  </header>

  <div style="display:flex;gap:24px;max-width:1100px;margin:28px auto;padding:0 20px">
    <aside style="width:260px">
      <div style="background:#fff;padding:16px;border-radius:12px">Courses</div>
      <ul style="margin-top:12px;list-style:none;padding:0">
        <li style="background:#fff;margin-top:8px;padding:12px;border-radius:10px">Intro to JavaScript</li>
        <li style="background:#fff;margin-top:8px;padding:12px;border-radius:10px">CSS for Beginners</li>
        <li style="background:#fff;margin-top:8px;padding:12px;border-radius:10px">Node.js APIs</li>
      </ul>
    </aside>

    <main style="flex:1">
      <div style="background:#fff;padding:20px;border-radius:12px"> 
        <h2 style="margin:0 0 8px">Welcome back, Student</h2>
        <p style="color:#6b7280;margin:0 0 12px">Resume your last course or browse new content.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px">
          <div style="background:#eef2ff;padding:12px;border-radius:10px">JavaScript — Lesson 3</div>
          <div style="background:#fff;padding:12px;border-radius:10px">CSS Grid — Lesson 1</div>
          <div style="background:#fff;padding:12px;border-radius:10px">Node Streams</div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
