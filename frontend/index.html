<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — E‑Learning</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page-login">
    <aside class="hero">
      <img src="assets/hero.svg" alt="hero illustration" class="hero-img">
      <div class="hero-text">
        <h1>Learn anywhere, anytime</h1>
        <p>Interactive courses, expert instructors, and flexible schedules.</p>
      </div>
    </aside>

    <section class="auth">
      <div class="auth-card">
        <img src="assets/logo.svg" alt="logo" class="logo">
        <h2>Welcome back</h2>
        <p class="muted">Sign in to continue to the E‑Learning platform</p>

        <form id="loginForm" class="form" novalidate>
          <label class="label">Email
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </label>

          <label class="label">Password
            <input id="password" name="password" type="password" placeholder="••••••••" required>
          </label>

          <div class="form-row space-between">
            <label class="checkbox">
              <input type="checkbox" id="remember"> Remember me
            </label>
            <a href="forgot.html" class="link">Forgot?</a>
          </div>

          <button type="submit" class="btn primary">Sign in</button>

          <div class="divider">or</div>

          <button type="button" class="btn outline" id="githubBtn">Sign in with GitHub</button>

          <p class="small">Don't have an account? <a href="signup.html">Create one</a></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
